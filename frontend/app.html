<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyze Sentiment — Sentiment Meter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="/" class="logo"><span>Sentiment</span>Meter</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/dashboard" class="btn">Dashboard</a>
  </div>
</nav>

<div class="container">
  <div class="page-heading">
    <h1>Sentiment Analyzer</h1>
    <p>Real-time AI polarity &amp; emotion profiling across 100+ news sources</p>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="e.g. Elon Musk, Taylor Swift, OpenAI..." onkeypress="if(event.key==='Enter') runAnalysis()">
    <button id="analyze-btn" onclick="runAnalysis()">Analyze →</button>
  </div>

  <div id="results" style="margin-top:2.5rem;"></div>
</div>

<footer>
  <p>Sentiment Meter — Powered by AI</p>
</footer>

<div id="toast" class="toast"></div>

<script>
const API_BASE = 'https://sentiment-meter-production.up.railway.app';
let apiKey = localStorage.getItem('sm_api_key');

async function runAnalysis() {
  const name = document.getElementById('search').value.trim();
  if (!name) return;
  const btn = document.getElementById('analyze-btn');
  const resultsDiv = document.getElementById('results');
  
  if (apiKey) {
    // Authenticated
    resultsDiv.innerHTML = '<div style="text-align:center; padding:3rem;"><div class="spinner"></div><p style="color:var(--text2); margin-top:1rem; font-size:0.9rem;">Scanning 100+ articles...</p></div>';
    btn.disabled = true;
    try {
      const r = await fetch(API_BASE + '/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
        body: JSON.stringify({ person: name })
      });
      const data = await r.json();
      if (r.status === 402) {
        resultsDiv.innerHTML = `<div class="sentiment-card" style="text-align:center;"><p style="color:var(--red); font-size:1.2rem; font-weight:600;">⚠️ Out of credits</p><p style="color:var(--text2); margin-top:0.5rem;">You have 0 credits remaining. <a href="/dashboard" style="color:var(--cyan); font-weight:600;">Buy more credits →</a></p></div>`;
        return;
      }
      if (data.error) { resultsDiv.innerHTML = `<div class="sentiment-card"><p style="color:var(--red);">Error: ${data.error}</p></div>`; return; }
      resultsDiv.innerHTML = renderResults(data, data.credits_remaining);
    } catch(err) {
      resultsDiv.innerHTML = `<div class="sentiment-card"><p style="color:var(--red);">Connection error. Is the backend running?</p></div>`;
    } finally { btn.disabled = false; }
  } else {
    // Demo
    resultsDiv.innerHTML = '<div style="text-align:center; padding:3rem;"><div class="spinner"></div><p style="color:var(--text2); margin-top:1rem; font-size:0.9rem;">Scanning (demo mode — limited results)...</p></div>';
    btn.disabled = true;
    try {
      const r = await fetch(API_BASE + '/analyze/demo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ person: name })
      });
      const data = await r.json();
      if (data.error) { resultsDiv.innerHTML = `<div class="sentiment-card"><p style="color:var(--red);">Error: ${data.error}</p></div>`; return; }
      resultsDiv.innerHTML = renderResults(data);
    } catch(err) {
      resultsDiv.innerHTML = `<div class="sentiment-card"><p style="color:var(--red);">Connection error. <a href="/dashboard" style="color:var(--cyan);">Get an API key →</a></p></div>`;
    } finally { btn.disabled = false; }
  }
}

function renderResults(data, creditsLeft) {
  const s = data.summary;
  const label = s.sentiment_label || 'Neutral';
  const color = label.includes('Positive') ? '#10b981' : label.includes('Negative') ? '#ef4444' : '#f59e0b';
  const barPct = ((s.avg_compound + 1) / 2 * 100).toFixed(1);
  
  let emotionsHtml = '';
  if (s.top_emotions && Object.keys(s.top_emotions).length > 0) {
    const emojis = {joy:'😊', anger:'😡', sadness:'😢', fear:'😨', surprise:'😲', trust:'🤝', anticipation:'🔮', disgust:'🤢'};
    const maxEmo = Math.max(...Object.values(s.top_emotions));
    emotionsHtml = '<div class="emotions"><h3>🧠 Emotion Profile</h3>';
    for (const [emo, score] of Object.entries(s.top_emotions)) {
      const pct = maxEmo > 0 ? (score / maxEmo * 100).toFixed(0) : 0;
      emotionsHtml += `
        <div class="emotion-row">
          <span class="emoji">${emojis[emo] || '❓'}</span>
          <span class="name">${emo.charAt(0).toUpperCase() + emo.slice(1)}</span>
          <div class="bar"><div class="bar-inner" style="width:${pct}%"></div></div>
          <span class="pct">${score}%</span>
        </div>`;
    }
    emotionsHtml += '</div>';
  }

  let headlinesHtml = '<div class="headlines"><h3>📰 Headlines Analyzed</h3>';
  if (data.results && data.results.length > 0) {
    const sorted = [...data.results].sort((a,b) => Math.abs(b.compound) - Math.abs(a.compound));
    sorted.forEach(r => {
      const c = r.compound >= 0.05 ? '🟢' : r.compound <= -0.05 ? '🔴' : '🟡';
      const cc = r.compound >= 0.05 ? '#10b981' : r.compound <= -0.05 ? '#ef4444' : '#f59e0b';
      let emotions = '';
      if (r.emotions && Object.keys(r.emotions).length > 0) {
        const top3 = Object.entries(r.emotions).sort((a,b) => b[1]-a[1]).slice(0,3);
        emotions = `<div style="font-size:0.78rem; color:var(--text3); margin-top:0.2rem;">↳ ${top3.map(([e,s]) => `${e} ${s}%`).join(' · ')}</div>`;
      }
      headlinesHtml += `
        <div class="headline-item">
          <span style="color:${cc}; font-weight:700; font-family:'JetBrains Mono', monospace; font-size:0.85rem;">${c} ${r.compound >= 0 ? '+' : ''}${r.compound.toFixed(2)}</span>
          <span class="source">${r.source}</span>
          <div class="text">${r.text.substring(0, 180)}${r.text.length > 180 ? '...' : ''}</div>
          ${emotions}
        </div>`;
    });
  }
  headlinesHtml += '</div>';

  let sourcesHtml = '';
  if (s.sources) {
    const entries = Object.entries(s.sources).slice(0, 5);
    sourcesHtml = `<div style="margin:0.8rem 0; font-size:0.8rem; color:var(--text3);">📡 ${entries.map(([src, cnt]) => `${src} (${cnt})`).join(' · ')}</div>`;
  }

  let creditNote = '';
  if (creditsLeft !== undefined) {
    creditNote = `<div style="margin-top:1.5rem; font-size:0.85rem; color:var(--text2); text-align:center; padding-top:1rem; border-top:1px solid var(--border-subtle);">💳 Credits remaining: <strong style="color:var(--cyan); font-family:'JetBrains Mono', monospace;">${creditsLeft}</strong></div>`;
  }

  return `
    <div class="sentiment-card">
      <div class="sentiment-header">
        <h2>${data.person}</h2>
        <span class="sentiment-badge" style="background:${color}22; color:${color}; border:1px solid ${color}44;">${label}</span>
      </div>
      <div class="sentiment-bar">
        <span style="color:var(--red); font-size:0.78rem; font-weight:500;">Negative</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${barPct}%; background: ${color}; color:${color}"></div>
        </div>
        <span style="color:var(--green); font-size:0.78rem; font-weight:500;">Positive</span>
        <span class="bar-value">${s.avg_compound >= 0 ? '+' : ''}${s.avg_compound.toFixed(2)}</span>
      </div>
      <div class="stats-grid">
        <div class="stat-card positive"><span class="num">${s.pct_positive}%</span><span class="label">Positive</span></div>
        <div class="stat-card neutral"><span class="num">${s.pct_neutral}%</span><span class="label">Neutral</span></div>
        <div class="stat-card negative"><span class="num">${s.pct_negative}%</span><span class="label">Negative</span></div>
      </div>
      ${sourcesHtml}
      ${emotionsHtml}
      ${headlinesHtml}
      ${creditNote}
    </div>`;
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
